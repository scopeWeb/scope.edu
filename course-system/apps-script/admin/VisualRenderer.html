<script>
/* Shared by the public page and Admin preview; content is always escaped. */
(function(root){
  const escape=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function render(v={},lang='en'){
    const bn=lang==='bn',t=(en,b)=>bn?b:en,p=x=>escape(x?.[lang]||x?.en||x?.bn||''),e=escape;
    const n=x=>Number.isFinite(Number(x))?Number(x):0;
    const section=(title,body,cls='')=>`<section class="cv-section ${cls}"><h2>${title}</h2>${body}</section>`;
    const cards=(key,title,ordered=false)=>!v[key]?.length?'':section(title,`<div class="cv-cards">${v[key].map((r,i)=>`<article class="cv-glass">${ordered?`<span class="cv-step">${String(i+1).padStart(2,'0')}</span>`:''}<h3>${p(r.title)}</h3><p>${p(r.description)}</p></article>`).join('')}</div>`);
    const image=(asset,alt,kind)=>asset?.id?`<img data-course-asset="${e(asset.id)}" alt="${e(alt)}" class="cv-image ${kind}" loading="lazy">`:`<span class="cv-placeholder ${kind}" aria-hidden="true">${e((alt||'?').slice(0,1))}</span>`;
    let html='';
    if(v.tools?.length)html+=section(t('Tools you will use','যেসব টুল শিখবেন'),`<div class="cv-tools">${v.tools.map(r=>`<article class="cv-tool cv-glass">${image(r.image,r.name,'cv-logo')}<div><h3>${e(r.name)}</h3><p>${p(r.description)}</p></div></article>`).join('')}</div>`);
    html+=cards('benefits',t('Why this programme','এই প্রোগ্রাম কেন'));
    for(const key of ['roadmap','workflow'])if(v[key]?.length)html+=section(key==='roadmap'?t('Your learning journey','শেখার যাত্রা'):t('From learning to practice','শেখা থেকে প্রয়োগ'),`<ol class="cv-road">${v[key].map((r,i)=>`<li><span class="cv-step">${i+1}</span><h3>${p(r.title)}</h3><p>${p(r.description)}</p></li>`).join('')}</ol>`,'cv-navy');
    if(v.instructors?.length)html+=section(t('Meet your instructors','আপনার প্রশিক্ষক'),`<div class="cv-instructors">${v.instructors.map(r=>`<article class="cv-instructor cv-glass"><div class="cv-portrait-wrap">${image(r.image,r.name,'cv-portrait')}</div><div><span class="cv-kicker">${p(r.role)}</span><h3>${e(r.name)}</h3><div class="cv-org">${p(r.organisation)}</div><p>${p(r.bio)}</p>${r.experience?.en||r.experience?.bn?`<p><strong>${t('Experience','অভিজ্ঞতা')}</strong><br>${p(r.experience)}</p>`:''}${r.teaches?.en||r.teaches?.bn?`<p class="cv-teaches"><strong>${t('Teaching','যে বিষয় শেখাবেন')}</strong> · ${p(r.teaches)}</p>`:''}</div></article>`).join('')}</div>`);
    html+=cards('outcomes',t('What you will be able to do','কোর্স শেষে যা করতে পারবেন'));
    if(v.projects?.length){
      const totals=v.projects.reduce((a,r)=>({credits:a.credits+n(r.credits),hours:a.hours+n(r.hours),sessions:a.sessions+n(r.sessions)}),{credits:0,hours:0,sessions:0});
      html+=section(t('Build your project portfolio','আপনার প্রজেক্ট পোর্টফোলিও'),`<div class="cv-cards">${v.projects.map((r,i)=>`<article class="cv-glass"><span class="cv-kicker">${t('PROJECT','প্রজেক্ট')} ${i+1}</span><h3>${p(r.title)}</h3><p>${p(r.description)}</p><div class="cv-metrics"><b>${n(r.hours)} <small>${t('live hours','লাইভ ঘণ্টা')}</small></b><b>${n(r.credits)} <small>${t('internal credits','ইন্টারনাল ক্রেডিট')}</small></b></div><div class="cv-bar" aria-label="${n(r.credits)} / ${totals.credits} ${t('credits','ক্রেডিট')}"><span style="width:${totals.credits?n(r.credits)/totals.credits*100:0}%"></span></div></article>`).join('')}</div>`);
      html+=section(t('Projects, time and credits','প্রজেক্ট, সময় ও ক্রেডিট'),`<div class="cv-table-scroll"><table><caption>${t('Programme workload','প্রোগ্রামের কাজের পরিমাণ')}</caption><thead><tr>${[t('Project','প্রজেক্ট'),t('Weeks','সপ্তাহ'),t('Sessions','ক্লাস'),t('Live hours','লাইভ ঘণ্টা'),t('Internal credits','ইন্টারনাল ক্রেডিট')].map(x=>`<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${v.projects.map(r=>`<tr><th scope="row">${p(r.title)}</th><td>${n(r.weeks)}</td><td>${n(r.sessions)}</td><td>${n(r.hours)}</td><td>${n(r.credits)}</td></tr>`).join('')}<tr class="cv-total"><th scope="row">${t('Total','মোট')}</th><td>—</td><td>${totals.sessions}</td><td>${totals.hours}</td><td>${totals.credits}</td></tr></tbody></table></div><p>${p(v.creditNote)||t('Credits are SCOPE internal assessment weights; they are not university or transferable academic credits.','ক্রেডিট SCOPE-এর নিজস্ব মূল্যায়নের ওজন; এগুলো বিশ্ববিদ্যালয়ের বা transferable academic credit নয়।')}</p>`);
    }
    if(v.syllabus?.length)html+=section(t('Syllabus','সিলেবাস'),`<div class="cv-syllabus">${v.syllabus.map((r,i)=>`<details class="cv-glass"><summary><span class="cv-kicker">${t('MODULE','মডিউল')} ${String(i+1).padStart(2,'0')}</span><strong>${p(r.title)}</strong><small>${n(r.sessions)} ${t('classes','ক্লাস')} · ${n(r.hours)} ${t('hours','ঘণ্টা')}</small></summary><p>${p(r.description)}</p></details>`).join('')}</div>`);
    html+=cards('assessmentSteps',t('Assessment and certification','মূল্যায়ন ও সনদ'),true);
    if(v.gradeBands?.length)html+=section(t('Grades and pass requirement','গ্রেড ও পাসের শর্ত'),`<div class="cv-table-scroll"><table><caption>${t('Assessment grade scale','মূল্যায়নের গ্রেড স্কেল')}</caption><thead><tr><th scope="col">${t('Mark (%)','নম্বর (%)')}</th><th scope="col">Grade</th><th scope="col">Grade point</th></tr></thead><tbody>${v.gradeBands.map(r=>`<tr><td>${n(r.min)} ${n(r.max)===100?'– 100':`– &lt; ${n(r.max)}`}</td><td><span class="cv-grade">${e(r.grade)}</span></td><td>${n(r.points).toFixed(2)}</td></tr>`).join('')}</tbody></table></div>`);
    html+=cards('retakes',t('Retake opportunities','পুনঃপরীক্ষার সুযোগ'),true)+cards('certificate',t('What the certificate means','সনদ কী বোঝায়'))+cards('enrolment',t('Before you enrol','ভর্তির আগে'));
    if(v.chart?.length){const sum=v.chart.reduce((s,r)=>s+n(r.value),0),max=Math.max(1,...v.chart.map(r=>n(r.value))),colors=['#13639d','#258d93','#6e62ae','#c78135','#618364'];let pos=0;
      const legend=`<ul class="cv-chart-list">${v.chart.map((r,i)=>`<li><span class="cv-swatch" style="background:${colors[i%colors.length]}"></span>${p(r.label)} <strong>${n(r.value)} ${e(v.chartUnit)}</strong></li>`).join('')}</ul>`;
      const chart=v.chartType==='donut'&&sum>0?`<div class="cv-donut" role="img" aria-label="${t('Distribution; values listed alongside','বণ্টন; মান পাশে দেওয়া আছে')}" style="background:conic-gradient(${v.chart.map((r,i)=>{const a=pos;pos+=n(r.value)/sum*100;return `${colors[i%colors.length]} ${a}% ${pos}%`;}).join(',')})"><span>${sum}<small>${e(v.chartUnit)}</small></span></div>`:`<div class="cv-chart-bars">${v.chart.map(r=>`<div><span>${p(r.label)} · ${n(r.value)} ${e(v.chartUnit)}</span><div class="cv-bar"><span style="width:${n(r.value)/max*100}%"></span></div></div>`).join('')}</div>`;
      html+=section(p(v.chartTitle)||t('Programme breakdown','প্রোগ্রামের বণ্টন'),`<div class="cv-chart">${chart}${legend}</div>`);
    }
    return `<div class="cv">${html}</div>`;
  }
  const mediaCache=new Map();
  async function hydrate(container,resolve){await Promise.all([...container.querySelectorAll('[data-course-asset]')].map(async img=>{try{const id=img.dataset.courseAsset;if(!mediaCache.has(id))mediaCache.set(id,Promise.resolve(resolve(id)));const asset=await mediaCache.get(id);if(!asset||!['image/png','image/jpeg','image/webp'].includes(asset.mime)||!asset.base64)throw Error();img.src=`data:${asset.mime};base64,${asset.base64}`;}catch(e){img.replaceWith(Object.assign(document.createElement('span'),{className:'cv-image-fallback',textContent:img.alt}));}}));}
  root.ScopeVisuals={render,hydrate};
  if(typeof module!=='undefined')module.exports=root.ScopeVisuals;
})(typeof window==='undefined'?globalThis:window);

</script>
