<style>.ve-group{margin:14px 0;border:1px solid #d6e3ed;border-radius:14px;background:#f3f7fa;padding:15px}.ve-group>summary{font-size:16px;font-weight:700;cursor:pointer}.ve-row{margin:12px 0;padding:15px;border-radius:12px;border:1px solid #dce5ee;background:white}.ve-row-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}.ve-row-head button{padding:6px 10px}.ve-image{max-width:100px;max-height:120px;object-fit:contain;display:block;margin:7px 0}.ve-image-box{border:1px dashed #b4cbdc;border-radius:10px;padding:12px}.ve-help{font-size:12px;color:#536e83}.ve-preview{background:#f1f5f8;padding:12px;border-radius:16px;margin:16px 0}.ve-notice{padding:12px;background:#e9f2fa;border-radius:10px}</style>
<script>
(function(){
 const schemas={
  instructors:['Instructors / প্রশিক্ষক',{name:'text:Full name',role:'pair:Designation / programme role',organisation:'pair:Organisation / current work',experience:'pair:Relevant experience',bio:'pair:Profile summary',teaches:'pair:Teaching responsibilities',image:'image:Portrait'}],
  tools:['Software and logos / সফটওয়্যার ও লোগো',{name:'text:Software / application name',description:'pair:How learners will use it',image:'image:Logo'}],
  benefits:['Programme benefits / কেন এই কোর্স',{title:'pair:Heading',description:'pair:Details'}],
  roadmap:['Learning roadmap / শেখার যাত্রা',{title:'pair:Stage or week range',description:'pair:Milestone'}],
  workflow:['Practical workflow / কাজের ধাপ',{title:'pair:Step',description:'pair:Details'}],
  outcomes:['Learning outcomes / যা শিখবেন',{title:'pair:Outcome',description:'pair:Details'}],
  projects:['Projects, time and credits / প্রজেক্ট ও ক্রেডিট',{title:'pair:Project title',description:'pair:Deliverable',weeks:'number:Weeks',sessions:'number:Live sessions',hours:'number:Live hours',credits:'number:Internal credits'}],
  syllabus:['Syllabus modules / সিলেবাস',{title:'pair:Module title',description:'pair:Topics and activities',sessions:'number:Classes',hours:'number:Hours'}],
  assessmentSteps:['Assessment and certification / মূল্যায়ন ও সনদ',{title:'pair:Step',description:'pair:Details'}],
  gradeBands:['Structured grading / গ্রেডিং টেবিল',{min:'number:Minimum mark (inclusive)',max:'number:Maximum (exclusive; 100 inclusive)',grade:'text:Grade label',points:'number:Grade point (0–4)'}],
  retakes:['Retake opportunities / পুনঃপরীক্ষা',{title:'pair:Retake stage',description:'pair:Timing, conditions and fee'}],
  certificate:['Certificate meaning / সনদের তথ্য',{title:'pair:Heading',description:'pair:Details'}],
  enrolment:['Before you enrol / ভর্তির আগে',{title:'pair:Heading',description:'pair:Details'}],
  chart:['Additional graph / অতিরিক্ত গ্রাফ',{label:'pair:Category',value:'number:Value'}]
 };
 let pending=0,epoch=0,serial=0;const previews=new Map();
 const el=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 window.loadVisuals=function(v={},defaults=false){
  epoch++;const host=el('visualEditor');host.innerHTML='<h2>Visual course designer / কোর্সের ভিজুয়াল ডিজাইন</h2><p class="ve-help">Add, reorder or remove cards. Empty groups stay hidden. বাংলা and English fields feed the same course template. Photos and logos: PNG, JPG or WebP; choose only images you may publish.</p>';
  for(const [key,[name,fields]] of Object.entries(schemas)){
   const group=document.createElement('details');group.className='ve-group';group.innerHTML=`<summary>${safe(name)}</summary><div data-list="${key}"></div><button type="button" class="secondary">+ Add ${safe(key==='instructors'?'instructor':key==='tools'?'software':'entry')}</button>`;
   group.querySelector('button').onclick=()=>{group.open=true;addRow(key,{})};host.appendChild(group);
   (v[key]||[]).forEach(r=>addRow(key,r));
  }
  if(defaults&&!v.gradeBands?.length)[[0,60,'F',0],[60,65,'B',3],[65,70,'B+',3.25],[70,75,'A−',3.5],[75,80,'A',3.75],[80,100,'A+',4]].forEach(([min,max,grade,points])=>addRow('gradeBands',{min,max,grade,points}));
  const extra=document.createElement('div');extra.className='grid';extra.innerHTML=`<label>Graph title — English<input id="ve-chart-en" value="${safe(v.chartTitle?.en)}"></label><label>Graph title — বাংলা<input id="ve-chart-bn" value="${safe(v.chartTitle?.bn)}"></label><label>Graph style<select id="ve-chart-type"><option value="bar">Bar chart</option><option value="donut">Donut chart</option></select></label><label>Graph unit<input id="ve-chart-unit" value="${safe(v.chartUnit)}" placeholder="Hours / sessions / credits"></label><label>Credit explanation — English<textarea id="ve-credit-en">${safe(v.creditNote?.en)}</textarea></label><label>Credit explanation — বাংলা<textarea id="ve-credit-bn">${safe(v.creditNote?.bn)}</textarea></label>`;host.appendChild(extra);el('ve-chart-type').value=v.chartType||'bar';
  const preview=document.createElement('div');preview.innerHTML='<div class="actions"><button type="button" id="ve-preview-en">Preview English</button><button type="button" id="ve-preview-bn" class="secondary">বাংলা প্রিভিউ</button></div><p class="ve-help">This preview uses the same visual components as the course page. Save changes before publishing.</p><div id="ve-preview" class="ve-preview"></div>';host.appendChild(preview);
  el('ve-preview-en').onclick=()=>previewVisuals('en');el('ve-preview-bn').onclick=()=>previewVisuals('bn');
 };
 function addRow(key,data){
  const row=document.createElement('div');row.className='ve-row';row.dataset.key=key;row.asset=data.image||null;row.innerHTML='<div class="ve-row-head"><strong>Entry</strong><div><button type="button" class="secondary" aria-label="Move up">↑</button> <button type="button" class="secondary" aria-label="Move down">↓</button> <button type="button" class="warn">Remove</button></div></div><div class="grid"></div>';
  const [up,down,remove]=row.querySelectorAll('button');up.onclick=()=>{if(row.previousElementSibling)row.parentNode.insertBefore(row,row.previousElementSibling)};down.onclick=()=>{if(row.nextElementSibling)row.parentNode.insertBefore(row.nextElementSibling,row)};remove.onclick=()=>row.remove();
  const grid=row.querySelector('.grid');
  for(const [keyField,def] of Object.entries(schemas[key][1])){const [type,label]=def.split(':');
   if(type==='pair'){for(const lang of ['en','bn']){const lab=document.createElement('label');const id='vf-'+(++serial);lab.htmlFor=id;lab.textContent=label+' — '+(lang==='en'?'English':'বাংলা');const input=document.createElement('textarea');input.id=id;input.dataset.field=keyField;input.dataset.lang=lang;input.maxLength=1800;input.value=data[keyField]?.[lang]||'';lab.appendChild(input);grid.appendChild(lab);}}
   else if(type==='image'){
    const box=document.createElement('div');box.className='ve-image-box wide';box.innerHTML=`<label>${safe(label)}<input type="file" accept="image/png,image/jpeg,image/webp"></label><img class="ve-image" alt="${safe(label)} preview" hidden><p class="ve-help" role="status"></p><button type="button" class="secondary">Remove image</button>`;
    const img=box.querySelector('img'),status=box.querySelector('p'),file=box.querySelector('input');
    box.querySelector('button').onclick=()=>{row.uploadVersion=(row.uploadVersion||0)+1;row.asset=null;img.hidden=true;file.value='';status.textContent='Image removed from this card.'};
    if(row.asset){const id=row.asset.id;status.textContent='Loading saved image…';call('getCourseAsset',id).then(a=>{if(!row.isConnected||row.asset?.id!==id)return;previews.set(id,a);img.src=`data:${a.mime};base64,${a.base64}`;img.hidden=false;status.textContent='Saved image';}).catch(()=>{status.textContent='Image could not be loaded. Replace it if needed.'});}
    file.onchange=async()=>{if(!file.files[0])return;const generation=epoch,version=row.uploadVersion=(row.uploadVersion||0)+1;pending++;status.textContent='Optimizing and uploading…';try{const a=await compress(file.files[0],key==='instructors'?640:320);const ref=await call('uploadCourseAsset',a);if(generation!==epoch||!row.isConnected||row.uploadVersion!==version)return;row.asset=ref;previews.set(ref.id,a);img.src=`data:${a.mime};base64,${a.base64}`;img.hidden=false;status.textContent='Uploaded. Save the course to attach this image.';}catch(err){status.textContent=err.message;}finally{pending--;file.value='';}};grid.appendChild(box);
   }else{const lab=document.createElement('label'),id='vf-'+(++serial);lab.htmlFor=id;lab.textContent=label;const input=document.createElement('input');input.id=id;input.dataset.field=keyField;input.type=type==='number'?'number':'text';if(type==='number'){input.min=0;input.step='any'}else input.maxLength=200;input.value=data[keyField]??'';lab.appendChild(input);grid.appendChild(lab);}
  }
  el('visualEditor').querySelector(`[data-list="${key}"]`).appendChild(row);
 }
 async function compress(file,max){
  if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>8*1024*1024)throw Error('Choose PNG, JPG or WebP under 8 MB.');
  const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();if(img.naturalWidth*img.naturalHeight>16000000)throw Error('Image dimensions are too large. Resize it first.');const ratio=Math.min(1,max/img.naturalWidth,max/img.naturalHeight),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let blob=await new Promise(r=>canvas.toBlob(r,'image/png'));for(const q of [.85,.7,.5,.35]){if(blob&&blob.size<=180000)break;blob=await new Promise(r=>canvas.toBlob(r,'image/webp',q));}if(!blob||blob.size>180000)throw Error('Image is still too large; choose a smaller image.');const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(blob)});return {mime:blob.type,base64};}finally{URL.revokeObjectURL(url)}
 }
 window.readVisuals=function(){if(pending)throw Error('Wait for image uploads to finish before saving or previewing.');const v={version:1};for(const key of Object.keys(schemas)){v[key]=[...el('visualEditor').querySelectorAll(`[data-list="${key}"]>.ve-row`)].map(row=>{const value={};row.querySelectorAll('[data-field]').forEach(i=>{if(i.dataset.lang){value[i.dataset.field]??={};value[i.dataset.field][i.dataset.lang]=i.value;}else{value[i.dataset.field]=i.type==='number'?Number(i.value||0):i.value;}});if('image'in schemas[key][1])value.image=row.asset;return value;});}v.chartTitle={en:el('ve-chart-en').value,bn:el('ve-chart-bn').value};v.chartType=el('ve-chart-type').value;v.chartUnit=el('ve-chart-unit').value;v.creditNote={en:el('ve-credit-en').value,bn:el('ve-credit-bn').value};return v;};
 async function previewVisuals(lang){const box=el('ve-preview');try{const data=readVisuals();box.innerHTML=ScopeVisuals.render(data,lang)||'<p>Add some visual content to preview it.</p>';await ScopeVisuals.hydrate(box,async id=>previews.get(id)||await call('getCourseAsset',id));}catch(err){box.textContent=err.message;}}
})();
</script>
